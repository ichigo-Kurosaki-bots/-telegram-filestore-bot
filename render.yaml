services:
  - type: web
    name: -telegram-filestore-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_CHANNEL_ID
        sync: false
      - key: ADMINS
        sync: false
      - key: FORCE_SUB_IMAGE
        sync: false
      - key: ABOUT_IMAGE
        sync: false
